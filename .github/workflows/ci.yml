name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + DB-invariant tests
        # Unit tests always run; db-invariants run only when DATABASE_URL is set (repo secret).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm test
